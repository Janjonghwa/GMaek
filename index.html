<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>풍수지리 처방전 - 상세 분석 버전</title>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        :root {
            --primary: #fbc531;
            --accent: #ff4757;
            --bg-dark: #111;
            --card-bg: rgba(255, 255, 255, 0.9);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --chart-fill: rgba(251, 197, 49, 0.3);
        }

        body { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; 
            background: var(--bg-dark);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            color: white;
            overflow: hidden;
        }

        .phone-mockup { 
            width: 375px; 
            height: 780px; 
            background: #000;
            border: 12px solid #333; 
            border-radius: 50px; 
            position: relative; 
            overflow: hidden; 
            color: #333; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }

        /* Status Bar Mockup */
        .status-bar {
            position: absolute;
            top: 0;
            width: 100%;
            height: 40px;
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            box-sizing: border-box;
            z-index: 30;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        /* Map Area */
        .map-area { 
            width: 100%; 
            height: 100%; 
            position: relative; 
            background: #eee;
        }
        
        .map-bg { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            filter: grayscale(0.5) brightness(0.8);
            transition: transform 10s linear;
        }

        /* Marker & Radar */
        .marker-container {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .marker { 
            width: 16px; 
            height: 16px; 
            background: var(--accent); 
            border: 3px solid white;
            border-radius: 50%; 
            box-shadow: 0 0 15px rgba(255,71,87,0.6);
        }

        .radar { 
            width: 80px; 
            height: 80px; 
            border: 2px solid var(--accent); 
            border-radius: 50%; 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            animation: pulse 2.5s infinite ease-out;
            pointer-events: none;
        }

        /* Survey Box */
        .survey-box { 
            position: absolute; 
            bottom: 20px; 
            left: 15px;
            right: 15px;
            background: var(--card-bg); 
            backdrop-filter: blur(10px);
            border-radius: 30px; 
            padding: 30px 25px; 
            box-sizing: border-box; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.2); 
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.4s;
            z-index: 20; 
        }

        .survey-title { 
            font-size: 18px; 
            font-weight: 800; 
            margin-bottom: 8px; 
            color: #1e272e;
        }
        
        .survey-desc { 
            font-size: 14px; 
            color: #576574; 
            margin-bottom: 25px; 
            line-height: 1.5;
        }

        .btn-group { display: flex; gap: 10px; }
        .btn { 
            flex: 1; 
            padding: 18px 10px; 
            border-radius: 16px; 
            border: 1px solid #dcdde1; 
            background: white; 
            cursor: pointer; 
            font-weight: 700; 
            transition: all 0.3s;
        }
        .btn:hover { background: #f1f2f6; transform: translateY(-2px); }

        /* Result Overlay */
        .result-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: #1a1a2e; 
            z-index: 100; 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            padding: 50px 25px; 
            box-sizing: border-box; 
            text-align: center; 
            color: var(--primary);
            overflow-y: auto;
            scrollbar-width: none;
        }
        .result-overlay::-webkit-scrollbar { display: none; }
        .result-overlay.active { display: flex; animation: slideUp 0.8s cubic-bezier(0.23, 1, 0.32, 1); }

        .badge { font-size: 50px; margin-bottom: 10px; filter: drop-shadow(0 0 10px rgba(251,197,49,0.3)); }
        .result-title { font-size: 26px; font-weight: 900; margin-bottom: 5px; }
        .result-score { font-size: 42px; font-weight: 900; color: #fff; margin-bottom: 25px; letter-spacing: -1px; }

        /* Radar Chart SVG */
        .chart-container { 
            width: 200px; 
            height: 200px; 
            position: relative; 
            margin-bottom: 30px; 
            filter: drop-shadow(0 0 15px rgba(251,197,49,0.2));
        }
        .chart-svg { width: 100%; height: 100%; transform: rotate(-18deg); }
        .chart-bg { fill: rgba(251, 197, 49, 0.05); stroke: rgba(251, 197, 49, 0.3); stroke-width: 1; }
        .chart-value { 
            fill: var(--chart-fill); 
            stroke: var(--primary); 
            stroke-width: 2.5; 
            stroke-linejoin: round;
            filter: drop-shadow(0 0 5px rgba(251,197,49,0.5));
            animation: chartFade 1.5s ease-out;
        }
        .chart-label { font-size: 11px; fill: rgba(255,255,255,0.7); font-weight: 600; }

        .prescription { 
            background: rgba(255,255,255,0.05); 
            padding: 20px; 
            border-radius: 20px; 
            border: 1px dashed var(--primary); 
            width: 100%; 
            margin-bottom: 30px; 
            box-sizing: border-box;
            text-align: left;
        }
        .pres-title { font-size: 15px; font-weight: bold; margin-bottom: 10px; color: var(--primary); }
        .pres-text { font-size: 14px; color: #fff; line-height: 1.6; opacity: 0.9; }

        .share-btn { 
            width: 100%; 
            padding: 20px; 
            background: var(--primary); 
            color: #1a1a2e; 
            border: none; 
            border-radius: 18px; 
            font-size: 17px; 
            font-weight: 800; 
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(251,197,49,0.2);
            transition: 0.3s;
            margin-top: auto;
        }
        .share-btn:hover { transform: scale(1.02); background: #fbc531; }

        /* Animations */
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes chartFade { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

        /* Loading Animation */
        .loading-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 50;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            backdrop-filter: blur(5px);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="phone-mockup">
    <!-- Status Bar -->
    <div class="status-bar">
        <span>9:41</span>
        <div style="display: flex; gap: 5px;">
            <span>📶</span>
            <span>🔋</span>
        </div>
    </div>

    <div class="map-area">
        <img src="map_bg.png" alt="Map" class="map-bg">
        <div class="marker-container">
            <div class="marker"></div>
            <div class="radar"></div>
        </div>
    </div>

    <div class="survey-box" id="surveyBox">
        <div class="survey-title">🏠 실내 기운 동기화 중</div>
        <div class="survey-desc">현관문을 열었을 때 창문이 바로 보이나요?</div>
        <div class="btn-group">
            <button class="btn" onclick="showProcess()">네, 보여요</button>
            <button class="btn" onclick="showProcess()">아니요</button>
        </div>
    </div>

    <div class="loading-layer" id="loadingLayer">
        <div class="spinner"></div>
        <div style="color: white; font-weight: 600; font-size: 14px;">기운을 상세 분석하는 중...</div>
    </div>

    <div class="result-overlay" id="resultOverlay">
        <div class="badge">🌻</div>
        <div class="result-title">재물운 대박 명당</div>
        <div class="result-score">88점</div>

        <!-- 레이더 차트 영역 -->
        <div class="chart-container">
            <svg class="chart-svg" viewBox="0 0 100 100">
                <!-- 가이드 라인 (거미줄) -->
                <polygon points="50,10 88,38 73,82 27,82 12,38" class="chart-bg" />
                <polygon points="50,25 73,42 64,68 36,68 27,42" class="chart-bg" />
                <polygon points="50,40 58,46 54,58 46,58 42,46" class="chart-bg" />

                <!-- 실제 데이터 값 (임의의 88점 분포) -->
                <!-- 배산:90, 임수:95, 지형:80, 현대:85, 비보:90 -->
                <polygon points="50,15 85,38 68,75 32,77 20,40" class="chart-value" />

                <!-- 텍스트 라벨 (회전 보정) -->
                <text x="45" y="7" class="chart-label" transform="rotate(18 50,50)">배산</text>
                <text x="88" y="42" class="chart-label" transform="rotate(18 50,50)">임수</text>
                <text x="65" y="92" class="chart-label" transform="rotate(18 50,50)">지형</text>
                <text x="15" y="92" class="chart-label" transform="rotate(18 50,50)">현대</text>
                <text x="2" y="42" class="chart-label" transform="rotate(18 50,50)">비보</text>
            </svg>
        </div>

        <div class="prescription">
            <div class="pres-title">💊 풍수 처방전</div>
            <div class="pres-text">
                전체적인 지형의 기운은 매우 훌륭하나, 실내 기운의 통로가 너무 열려있어 재물이 샐 위험이 있습니다. 현관에 노란 해바라기 소품을 두어 들어온 복을 꽉 잡아두세요!
            </div>
        </div>

        <button class="share-btn">인스타 공유하고 복 받기</button>
    </div>
</div>

<script>
    function showProcess() {
        document.getElementById('surveyBox').style.transform = 'translateY(120%)';
        document.getElementById('surveyBox').style.opacity = '0';
        
        const loadingLayer = document.getElementById('loadingLayer');
        setTimeout(() => {
            loadingLayer.style.display = 'flex';
        }, 300);

        setTimeout(() => {
            loadingLayer.style.display = 'none';
            document.getElementById('resultOverlay').classList.add('active');
        }, 2000);
    }
</script>

</body>
</html>
